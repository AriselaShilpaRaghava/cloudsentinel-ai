services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudsentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: cloudsentinel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data

  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cloudsentinel:${POSTGRES_PASSWORD:-change_me}@postgres:5432/cloudsentinel
      ML_SERVICE_URL: http://ml_service:8001
      JWT_SECRET: ${JWT_SECRET:-change_me}
    depends_on:
      - postgres
      - ml_service

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      ML_SERVICE_URL: http://ml_service:8001
      STATE_FILE: /tmp/cloudsentinel_state_v1.json
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - ml_service

volumes:
  pg_data:
